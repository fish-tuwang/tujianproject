<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>图鉴 · 数据管理</title><link rel="stylesheet" href="admin.css"></head><body><main><header><a href="/preview/">← 返回图鉴</a><h1>数据管理</h1><p>查看同步进度、重试失败页面和修正资料。</p></header><section><label>管理凭证<input id="token" type="password" autocomplete="off" placeholder="仅本次页面保留"></label><button id="connect">连接</button><p id="message" role="status"></p></section><section><h2>手动更新</h2><select id="source"><option value="tomica">多美卡</option><option value="pokemon">宝可梦</option></select><select id="mode"><option value="incremental">增量检查</option><option value="full">完整核对</option></select><button id="sync">开始同步</button></section><section><h2>最近任务</h2><div id="runs">连接后显示</div></section><section><h2>待处理问题</h2><div id="issues">连接后显示</div></section><section><h2>资料纠错</h2><p>填写条目标识和展示字段，保留原始采集值。</p><select id="kind"><option value="tomica_model">车型</option><option value="tomica_variant">车型版本</option><option value="pokemon">宝可梦</option><option value="pokemon_form">形态</option></select><input id="entity" placeholder="车型ID / 全国编号"><input id="field" placeholder="字段，如 name_display / brand"><textarea id="value" placeholder="文本值；数字或数组使用JSON"></textarea><button id="save">保存覆盖值</button><pre id="result"></pre></section></main><script src="admin.js"></script></body></html>
