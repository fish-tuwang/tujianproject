<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#edf4fa"><title>登录 · 小小藏家</title><link rel="stylesheet" href="/auth-assets/auth.css?v=0.10.0"></head>
<body><main class="auth-shell"><section class="intro"><a class="brand" href="/login/"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3 29 16 16 29 3 16Z M16 10 22 16 16 22 10 16Z" fill="none" stroke="currentColor" stroke-width="2"/></svg><span>小小藏家<small>LITTLE ATLAS</small></span></a><div class="intro-copy"><span class="eyebrow">YOUR PERSONAL COLLECTION</span><h1>把热爱，<br>一件件收好。</h1><p>从喜欢的小车，到熟悉的伙伴。<br>这里，留着属于你的收藏时光。</p><div class="collection-tags"><span>▱ 多美卡图鉴</span><span>◉ 宝可梦图鉴</span></div></div><span class="intro-bottom">小小的世界，大大的热爱。</span></section>
<section class="form-panel"><div class="form-heading"><span class="eyebrow">WELCOME TO LITTLE ATLAS</span><h2 id="form-title">欢迎回来</h2><p id="form-description">登录后，继续你的图鉴旅程。</p><span id="account-username"></span></div>
<form id="login-form"><label for="username">账号</label><input id="username" name="username" autocomplete="username" maxlength="64" required placeholder="输入你的账号"><label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required placeholder="输入密码"><button id="submit-login" type="submit">登录，翻开图鉴 <span>↗</span></button></form>
<form id="password-form" hidden><label for="current-password">当前密码</label><input id="current-password" type="password" autocomplete="current-password" maxlength="128" required><label for="new-password">新密码</label><input id="new-password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required placeholder="15–128个字符"><label for="confirm-password">确认新密码</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="15" maxlength="128" required><button id="submit-password" type="submit">保存并进入图鉴 <span>↗</span></button></form>
<p id="feedback" role="status" aria-live="polite"></p><button id="signout" class="text-button" type="button" hidden>退出登录</button><p class="form-footer">仅限已开通的账号登录</p></section></main><script src="/auth-assets/auth.js?v=0.10.0"></script></body></html>
