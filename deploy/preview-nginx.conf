events { worker_connections 256; }
http {
    map $uri $catalog_guard_key {
        default $binary_remote_addr;
        /health/live "";
        /health/ready "";
        /robots.txt "";
    }
    map $uri $catalog_api_key {
        default "";
        ~^/api/(?:tomica|tomica-news|pokemon|gunpla)(?:/|$) $binary_remote_addr;
    }
    map $uri $catalog_image_key {
        default "";
        ~^/(?:api/reference-images/|preview/news-assets/) $binary_remote_addr;
    }
    map $uri $catalog_login_key {
        default "";
        ~^/api/auth/login/?$ $binary_remote_addr;
    }
    map $http_user_agent $catalog_known_crawler {
        default 0;
        ~*(?:Googlebot|bingbot|Baiduspider|Bytespider|PetalBot|YandexBot|DuckDuckBot|Sogou.*spider|360Spider|AhrefsBot|SemrushBot|MJ12bot|DotBot|GPTBot|ChatGPT-User|OAI-SearchBot|ClaudeBot|Claude-SearchBot|CCBot|Applebot|Amazonbot|facebookexternalhit|Twitterbot|Pinterestbot|Scrapy) 1;
    }
    map "$status:$upstream_http_retry_after" $catalog_retry_after {
        default "";
        "429:" 10;
    }
    limit_req_zone $catalog_guard_key zone=catalog_global:4m rate=60r/s;
    limit_req_zone $catalog_api_key zone=catalog_api:4m rate=8r/s;
    limit_req_zone $catalog_image_key zone=catalog_images:4m rate=30r/s;
    limit_req_zone $catalog_login_key zone=catalog_login:1m rate=6r/m;
    limit_conn_zone $catalog_guard_key zone=catalog_clients:2m;
    log_format catalog_json escape=json '{"time":"$time_iso8601","request_id":"$request_id","client_ip":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,"user_agent":"$http_user_agent","request_limit":"$limit_req_status","connection_limit":"$limit_conn_status","known_crawler":"$catalog_known_crawler"}';
    access_log /var/log/dual-catalog/access.jsonl catalog_json;
    error_log /dev/stderr warn;
    server {
        listen 80;
        server_name _;
        location ^~ /.well-known/acme-challenge/ { root /var/www/dual-catalog-acme; try_files $uri =404; }
        location / { return 308 https://117.72.11.77$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name 117.72.11.77;
        if ($host != "117.72.11.77") { return 444; }
        ssl_certificate /etc/letsencrypt/live/117.72.11.77/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/117.72.11.77/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        limit_req zone=catalog_global burst=400 nodelay;
        limit_req zone=catalog_api burst=24 nodelay;
        limit_req zone=catalog_images burst=240 nodelay;
        limit_req zone=catalog_login burst=5 nodelay;
        limit_req_status 429;
        limit_conn catalog_clients 40;
        limit_conn_status 429;
        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        add_header Retry-After $catalog_retry_after always;
        location = /robots.txt {
            default_type text/plain;
            return 200 "User-agent: *\nDisallow: /\n";
        }
        location = /api/admin { return 404; }
        location ^~ /api/admin/ { return 404; }
        location = /admin { return 404; }
        location ^~ /admin/ { return 404; }
        location = /health/live { proxy_pass http://127.0.0.1:8092; }
        location = /health/ready { proxy_pass http://127.0.0.1:8092; }
        location ^~ /api/auth/ {
            if (-f /var/run/dual-catalog-gates/maintenance) { return 503; }
            if ($catalog_known_crawler) { return 403; }
            limit_except GET HEAD POST { deny all; }
            client_max_body_size 4k;
            proxy_pass http://127.0.0.1:8092;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Catalog-Service "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        location / {
            if (-f /var/run/dual-catalog-gates/maintenance) { return 503; }
            if ($catalog_known_crawler) { return 403; }
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8092;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Catalog-Service "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
