events { worker_connections 256; }
http {
    log_format catalog_json escape=json '{"time":"$time_iso8601","request_id":"$request_id","client_ip":"$remote_addr","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent,"duration":$request_time,"user_agent":"$http_user_agent"}';
    access_log /var/log/dual-catalog/access.jsonl catalog_json;
    error_log /dev/stderr warn;
    server {
        listen 80;
        server_name _;
        location ^~ /.well-known/acme-challenge/ { root /var/www/dual-catalog-acme; try_files $uri =404; }
        location / { return 308 https://117.72.11.77$request_uri; }
    }
    server {
        listen 443 ssl;
        server_name 117.72.11.77;
        if ($host != "117.72.11.77") { return 444; }
        ssl_certificate /etc/letsencrypt/live/117.72.11.77/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/117.72.11.77/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        add_header X-Request-ID $request_id always;
        add_header X-Content-Type-Options nosniff always;
        location = /api/admin { return 404; }
        location ^~ /api/admin/ { return 404; }
        location = /admin { return 404; }
        location ^~ /admin/ { return 404; }
        location = /health/live { proxy_pass http://127.0.0.1:8092; }
        location = /health/ready { proxy_pass http://127.0.0.1:8092; }
        location ^~ /api/auth/ {
            if (-f /var/run/dual-catalog-gates/maintenance) { return 503; }
            limit_except GET HEAD POST { deny all; }
            client_max_body_size 4k;
            proxy_pass http://127.0.0.1:8092;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Catalog-Service "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
        location / {
            if (-f /var/run/dual-catalog-gates/maintenance) { return 503; }
            limit_except GET HEAD { deny all; }
            proxy_pass http://127.0.0.1:8092;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Catalog-Service "";
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
        }
    }
}
