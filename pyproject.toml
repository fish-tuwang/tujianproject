[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dual-catalog"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2,<3", "pydantic-settings>=2,<3", "SQLAlchemy>=2,<2.1", "psycopg[binary]>=3,<4", "alembic>=1.13,<2", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5", "APScheduler>=3.11,<4", "boto3>=1.35,<2", "uvicorn>=0.30,<1", "redis>=5,<7", "Pillow==13.0.0"]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<8", "pip-tools>=7,<8"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
